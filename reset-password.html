<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restablecer contraseña - Planificador de Horarios</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;">
  <div class="card" style="width: 420px;">
    <div class="card-h"><strong>Nueva contraseña</strong></div>
    <div class="card-c stack" style="padding:16px;">
      <p id="reset-email-label" class="muted" style="margin:0;">Validando enlace...</p>
      <input type="password" id="new-password" class="input" placeholder="Nueva contraseña" disabled>
      <input type="password" id="confirm-password" class="input" placeholder="Repetir contraseña" disabled>
      <button id="reset-password-btn" class="btn" disabled>Guardar nueva contraseña</button>
      <a href="index.html" class="btn secondary" style="text-align:center;">Volver al login</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
