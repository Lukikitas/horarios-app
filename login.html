<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Planificador de Horarios</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-screen">
    <div class="login-brand">
      <img id="login-logo" src="assets/logo.PNG" alt="STAR App" class="login-logo" onerror="if (this.src.endsWith('logo.PNG')) this.src='assets/logo.png';">
      <p class="login-tagline">Acceso para managers</p>
    </div>
    <div class="card login-card">
      <div class="card-h login-card-h">
        <div>
          <strong class="login-title">Iniciar sesión</strong>
          <p class="login-subtitle">Ingresá con tu cuenta corporativa</p>
        </div>
      </div>
      <div class="card-c stack login-card-body">
        <div id="login-view">
          <div id="login-alert" class="login-alert login-alert--hidden" role="alert" aria-live="assertive" hidden></div>
          <label class="login-label" for="email">Email</label>
          <input type="email" id="email" class="input login-input" placeholder="nombre@empresa.com" autocomplete="username">
          <label class="login-label" for="password">Contraseña</label>
          <input type="password" id="password" class="input login-input" placeholder="Tu contraseña" autocomplete="current-password">
          <button type="button" id="login" class="btn login-btn-primary">Ingresar</button>
          <button type="button" id="btn-forgot-password" class="btn secondary login-btn-secondary">Recuperar contraseña</button>
        </div>
      </div>
    </div>
  </main>

  <div id="forgot-password-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width: 420px;">
      <div class="card">
        <div class="card-h">
          <strong>Recuperar contrasena</strong>
          <button id="forgot-password-close" class="btn secondary del" style="margin-left:auto;">&times;</button>
        </div>
        <div class="card-c stack" style="padding:16px;">
          <p class="muted" style="margin:0;">Ingresa tu email de manager para enviarte el enlace de cambio de contrasena.</p>
          <input type="email" id="forgot-password-email" class="input" placeholder="Email">
          <button id="forgot-password-send" class="btn">Enviar email de recuperacion</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
