<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planificador de Horarios</title>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bar">
    <div class="bar-inner">
      <div class="row">
        <h1 style="font-size: 1.1em; white-space: nowrap;">Planificador de Horarios</h1>
        <div id="main-menu" style="margin-left: 16px;">
          <button id="btn-view-schedule" class="btn main-menu-btn">Horarios</button>
          <button id="btn-view-employees" class="btn secondary main-menu-btn">Empleados</button>
          <button id="btn-view-templates" class="btn secondary main-menu-btn">Plantillas</button>
          <button id="btn-weekly-summary" class="btn secondary main-menu-btn">Resumen semanal</button>
        </div>
        <select id="weekSelector" class="select" title="Seleccionar semana" style="margin-left: 16px;"></select>
        <select id="roleFilter" class="select" title="Filtrar por rol" style="margin-left: 8px;"></select>

        <div class="dropdown" style="margin-left: 8px;">
          <button id="btn-actions" class="btn secondary">Acciones ▾</button>
          <div id="actions-dropdown" class="dropdown-content">
            <button id="btnExport" class="dropdown-item">Exportar JSON</button>
            <button id="btnPrint" class="dropdown-item">Imprimir</button>
            <label class="dropdown-item" style="cursor:pointer;">
              Importar JSON<input id="fileImport" class="file" type="file" accept="application/json" style="display:none">
            </label>
          </div>
        </div>
        <button id="btn-dark-mode" class="btn secondary" style="margin-left:auto;">🌙</button>
      </div>
    </div>
  </div>

  <div>
    <div id="view-employees" class="wrap" style="display:none; max-width: 600px; margin: 0 auto;">
        <!-- Empleados -->
        <section class="card">
            <div class="card-h"><strong>Empleados</strong></div>
            <div class="card-c stack">
                <div class="row">
                    <input id="inpName" class="input" placeholder="Nombre y apellido" style="flex:1">
                    <button id="btnAddEmp" class="btn">Añadir</button>
                </div>
                <div class="hr"></div>
                <div class="row">
                  <label class="btn secondary" style="cursor:pointer;">
                    Importar desde Excel
                    <input id="fileImportExcel" class="file" type="file" accept=".xlsx, .xls" style="display:none">
                  </label>
                </div>
                <div class="hr"></div>
                <div class="row">
                    <span class="muted" style="font-size:12px">Filtrar empleados por estrella:</span>
                    <select id="empFilter" class="select"></select>
                </div>

                <div class="hr"></div>
                <div class="row">
                    <input id="empSearch" class="input" placeholder="Buscar empleado..." style="flex:1">
                </div>

                <div id="empList" class="stack"></div>
            </div>
        </section>
    </div>

    <div id="view-templates" class="wrap" style="display:none; max-width: 600px; margin: 0 auto;">
        <!-- Plantillas -->
        <section class="card">
            <div class="card-h"><strong>Plantillas de días</strong></div>
            <div class="card-c stack">
                <div class="row">
                    <input id="inpTemplateName" class="input" placeholder="Nombre de la plantilla" style="flex:1">
                    <button id="btnSaveTemplate" class="btn">Guardar día actual como plantilla</button>
                </div>
                <div class="hr"></div>
                <div id="templateList" class="stack"></div>
            </div>
        </section>
    </div>

    <div id="view-schedule" class="wrap" style="max-width: none; padding: 0 16px;">
        <!-- Horarios -->
        <section class="card">
            <div class="card-h card-h-controls">
                <div class="controls-left">
                    <div class="controls-group">
                        <div class="control-item"><label for="activeRole" class="muted">Rol</label><select id="activeRole" class="select"></select></div>
                        <div class="control-item"><label for="formStart" class="muted">Inicio</label><select id="formStart" class="select"></select></div>
                        <div class="control-item"><label for="formEnd" class="muted">Fin</label><select id="formEnd" class="select"></select></div>
                        <div class="control-item"><span id="shiftDuration" class="muted"></span></div>
                        <div class="control-item"><button id="btnAddUnassignedShift" class="btn">Crear turno</button></div>
                    </div>
                </div>
                <div class="controls-center">
                    <h2 id="day-title" class="day-title"></h2>
                    <div class="controls-group">
                        <div class="control-item"><label for="projectedTickets" class="muted">Tickets</label><input id="projectedTickets" type="number" class="input"></div>
                        <div class="control-item"><label class="muted">Prod.</label><span id="projectedProductivity" class="strong"></span></div>
                    </div>
                </div>
                <div class="controls-right">
                    <div id="dayTabs" class="row" style="flex-wrap:wrap;"></div>
                </div>
            </div>

            <!-- Grilla -->
            <div class="scroller">
                <div class="table">
                    <div id="thead" class="thead"></div>
                    <div id="tbody"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Sticky Legend Footer -->
    <div id="legend-footer" class="legend-footer">
        <div id="legend" class="legend"></div>
    </div>

  </div>

  <!-- Print Modal -->
  <div id="print-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="card">
        <div class="card-h">
          <strong>Imprimir</strong>
          <button id="print-modal-close" class="btn secondary del" style="margin-left: auto;">&times;</button>
        </div>
        <div class="card-c stack" style="padding: 20px;">
          <p>Seleccione el formato de impresión:</p>
          <div class="row" style="justify-content: center; gap: 16px;">
            <button id="btn-print-schedule-list" class="btn">Listado de horarios</button>
            <button id="btn-print-daily-planning" class="btn">Planificación diaria</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Weekly Summary Modal -->
  <div id="weekly-summary-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div class="card">
            <div class="card-h">
                <div class="stack" style="gap: 0;">
                    <strong>Resumen Semanal</strong>
                    <h4 id="weekly-summary-title" class="muted" style="margin:0;font-weight:normal;font-size:13px;"></h4>
                </div>
                <button id="weekly-summary-modal-close" class="btn secondary del" style="margin-left: auto;">&times;</button>
            </div>
            <div id="weekly-summary-content" class="card-c">
                <!-- Content will be generated by app.js -->
            </div>
        </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
