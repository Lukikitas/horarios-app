<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planificador de Horarios</title>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bar">
    <div class="bar-inner">
      <div class="row">
        <h1>Planificador de Horarios</h1>
        <div id="main-menu" style="margin-left: 20px;">
          <button id="btn-view-schedule" class="btn">Hacer Horarios</button>
          <button id="btn-view-employees" class="btn secondary">Agregar Empleados</button>
          <button id="btn-view-templates" class="btn secondary">Plantillas</button>
        </div>
      </div>
      <div class="row">
        <select id="weekSelector" class="select" title="Seleccionar semana"></select>
        <select id="roleFilter" class="select" title="Filtrar por rol" style="margin-left: 12px;"></select>
        <button id="btnExport" class="btn">Exportar</button>
        <label class="btn secondary" style="cursor:pointer;">
          Importar<input id="fileImport" class="file" type="file" accept="application/json" style="display:none">
        </label>
      </div>
    </div>
  </div>

  <div>
    <div id="view-employees" class="wrap" style="display:none; max-width: 600px; margin: 0 auto;">
        <!-- Empleados -->
        <section class="card">
            <div class="card-h"><strong>Empleados</strong></div>
            <div class="card-c stack">
                <div class="row">
                    <input id="inpName" class="input" placeholder="Nombre y apellido" style="flex:1">
                    <button id="btnAddEmp" class="btn">Añadir</button>
                </div>
                <div class="hr"></div>
                <div class="row">
                  <label class="btn secondary" style="cursor:pointer;">
                    Importar desde Excel
                    <input id="fileImportExcel" class="file" type="file" accept=".xlsx, .xls" style="display:none">
                  </label>
                </div>
                <div class="hr"></div>
                <div class="row">
                    <span class="muted" style="font-size:12px">Filtrar empleados por estrella:</span>
                    <select id="empFilter" class="select"></select>
                </div>

                <div id="empList" class="stack"></div>
            </div>
        </section>
    </div>

    <div id="view-templates" class="wrap" style="display:none; max-width: 600px; margin: 0 auto;">
        <!-- Plantillas -->
        <section class="card">
            <div class="card-h"><strong>Plantillas de días</strong></div>
            <div class="card-c stack">
                <div class="row">
                    <input id="inpTemplateName" class="input" placeholder="Nombre de la plantilla" style="flex:1">
                    <button id="btnSaveTemplate" class="btn">Guardar día actual como plantilla</button>
                </div>
                <div class="hr"></div>
                <div id="templateList" class="stack"></div>
            </div>
        </section>
    </div>

    <div id="view-schedule" class="wrap" style="max-width: none; padding: 0 16px;">
        <!-- Horarios -->
        <section class="card">
            <div class="card-h" style="gap:8px;flex-wrap:wrap">
                <div id="dayTabs" class="row" style="flex-wrap:wrap"></div>
                <div class="row" style="margin-left:auto">
                    <span class="muted" style="font-size:12px">Rol activo:</span>
                    <select id="activeRole" class="select"></select>
                </div>
            </div>

            <!-- Form para crear turnos -->
            <div class="card-c" style="border-bottom:1px solid var(--border)">
                <div class="row" style="flex-wrap:wrap;gap:10px">
                    <div>
                        <div class="muted" style="font-size:12px">Inicio</div>
                        <select id="formStart" class="select"></select>
                    </div>
                    <div>
                        <div class="muted" style="font-size:12px">Fin (exclusivo)</div>
                        <select id="formEnd" class="select"></select>
                    </div>
                    <div style="align-self: end; padding-bottom: 4px;">
                        <span id="shiftDuration" class="muted" style="font-size: 14px;"></span>
                    </div>
                    <button id="btnAddUnassignedShift" class="btn" style="margin-left: auto;">Crear turno</button>
                </div>
            </div>

            <!-- Grilla -->
            <div class="scroller">
                <div class="table">
                    <div id="thead" class="thead"></div>
                    <div id="tbody"></div>
                </div>
            </div>

            <!-- Leyenda -->
            <div class="card-c">
                <div><strong>Leyenda de roles</strong></div>
                <div id="legend" class="legend" style="margin-top:8px"></div>
            </div>
        </section>
    </div>

    <div style="margin-top:12px" class="muted">
      Guardado automático en este navegador.
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
