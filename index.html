<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Planificador de Horarios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div class="card" style="width: 400px;">
    <div class="card-h"><strong>Iniciar Sesión</strong></div>
    <div class="card-c stack">
      <div id="login-view">
        <input type="email" id="email" class="input" placeholder="Email">
        <input type="password" id="password" class="input" placeholder="Contraseña">
        <button id="login" class="btn" style="width: 100%;">Ingresar</button>
        <div class="hr"></div>
        <button id="show-dni-login" class="btn secondary" style="width: 100%;">Soy empleado</button>
      </div>
      <div id="dni-login-view" style="display: none;">
        <p class="muted" style="text-align: center;">Ingresa tu DNI para recibir un enlace de registro.</p>
        <input type="text" id="dni" class="input" placeholder="DNI">
        <button id="send-link" class="btn" style="width: 100%;">Enviar enlace</button>
        <div class="hr"></div>
        <button id="show-manager-login" class="btn secondary" style="width: 100%;">Soy gerente</button>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
